name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin.json
        run: |
          v=$(node -p "require('./plugin.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != plugin.json v$v"; exit 1; }
      - name: Package
        run: |
          node scripts/package.js
          cd dist && zip ../package.zip index.js index.css plugin.json README.md README_zh_CN.md CHANGELOG.md CHANGELOG_zh_CN.md LICENSE $(ls icon.png preview.png 2>/dev/null)
      - uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          body_path: dist/RELEASE_NOTES.md
